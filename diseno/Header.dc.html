<helmet>

<header style="width:100%;font-family:Inter,system-ui,sans-serif;color:#17201A;background:#F6F5F0;border-bottom:1px solid #DAD7CB">

      <nav aria-label="Enlaces de servicio" style="display:flex;gap:20px;flex-wrap:wrap">
        <a href="Socios.dc.html" style="color:#E2E3DA;text-decoration:none">Área de socios</a>
        <a href="Socios.dc.html" style="color:#E2E3DA;text-decoration:none">Boletines A.T.R.I.A</a>
        <a href="FAQ.dc.html" style="color:#E2E3DA;text-decoration:none">Ayuda</a>
      </nav>
    </div>
  </div>
  <div style="max-width:1240px;margin:0 auto;padding:16px 32px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px">

    <nav aria-label="Principal" style="display:flex;flex-wrap:wrap;gap:4px 28px;align-items:center">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
        <a href="{{n.href}}" aria-current="{{n.current}}" style="{{n.style}}">{{n.label}}</a>
      </sc-for>
    </nav>
    <div style="display:flex;gap:4px;align-items:center">
      <button type="button" aria-label="Buscar" style="width:44px;height:44px;border:0;background:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17201A" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>

      <a href="Tienda.dc.html" aria-label="Carrito, 0 productos" style="height:44px;padding:0 16px;border-radius:999px;background:#17201A;color:#F6F5F0;display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F6F5F0" stroke-width="1.8" aria-hidden="true"><path d="M5 7h14l-1.5 12h-11z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>0</a>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["inicio","tienda","cooperativa","fincas","calidad","visitas","blog","contacto"],"default":"inicio"},"$preview":{"width":1440,"height":140}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'inicio';
    const items = [
      { id: 'tienda', label: 'Tienda', href: 'Tienda.dc.html' },
      { id: 'cooperativa', label: 'Cooperativa', href: 'Cooperativa.dc.html' },
      { id: 'fincas', label: 'Fincas', href: 'Fincas.dc.html' },
      { id: 'calidad', label: 'Calidad y premios', href: 'Calidad.dc.html' },
      { id: 'visitas', label: 'Visitas', href: 'Visitas.dc.html' },
      { id: 'blog', label: 'Blog', href: 'BlogPortada.dc.html' },
      { id: 'contacto', label: 'Contacto', href: 'Main.dc.html#contacto' }
    ];
    const base = 'display:inline-flex;align-items:center;min-height:44px;color:#17201A;text-decoration:none;font-size:15px;font-weight:500;';
    return {
      nav: items.map((n) => ({
        ...n,
        current: n.id === active ? 'page' : 'false',
        style: base + (n.id === active ? 'box-shadow:inset 0 -2px 0 #3F5B2E;font-weight:600;' : '')
      }))
    };
  }
}
</script>
</body>
</html>
