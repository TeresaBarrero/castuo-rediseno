<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Castuo · Preguntas frecuentes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F6F5F0}
*{box-sizing:border-box}
a{color:#3F5B2E}a:hover{color:#17201A}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(40px,5vw,72px);line-height:1.03;letter-spacing:-.025em;margin:0}
.lay{display:flex;flex-wrap:wrap;gap:56px;align-items:flex-start}
.side{flex:1 1 240px;max-width:300px;display:flex;flex-direction:column;gap:8px}
.main{flex:999 1 560px;min-width:0}
@media (max-width:960px){.side{max-width:none;flex-direction:row;flex-wrap:wrap}}
</style>
</helmet>
<div style="width:100%;font-family:Inter,system-ui,sans-serif;color:#17201A;background:#F6F5F0">
<dc-import name="Header" active="" hint-size="100%,132px"></dc-import>
<main>
  <section style="padding:40px 0 64px">
    <div class="wrap" style="display:flex;flex-direction:column;gap:22px">
      <nav aria-label="Migas de pan" style="font-size:14px;color:#55594F"><a href="Main.dc.html">Inicio</a> / <span aria-current="page">Preguntas frecuentes</span></nav>
      <h1 class="h1">Preguntas frecuentes</h1>
      <p style="margin:0;max-width:680px;font-size:19px;line-height:1.6;color:#4B4F45">Envíos, pagos, conservación del aceite y todo lo que nos soléis preguntar.</p>
    </div>
  </section>

  <section style="padding:0 0 104px">
    <div class="wrap lay">
      <nav class="side" aria-label="Temas">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
          <button type="button" onClick="{{g.pick}}" aria-pressed="{{g.on}}" style="{{g.style}}">{{g.label}}</button>
        </sc-for>
        <div style="margin-top:24px;background:#fff;border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.55">
          <p style="margin:0;font-weight:600">¿No encuentras tu respuesta?</p>
          <p style="margin:0;color:#4B4F45">Llámanos al <a href="tel:+34687972877">687 97 28 77</a> o escribe a <a href="mailto:info@castuo.es">info@castuo.es</a>.</p>
        </div>
      </nav>
      <div class="main">
        <h2 style="margin:0 0 16px;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:30px">{{title}}</h2>
        <sc-for list="{{faqs}}" as="f" hint-placeholder-count="4">
          <div style="border-top:1px solid #DAD7CB">
            <button type="button" onClick="{{f.toggle}}" aria-expanded="{{f.open}}" style="width:100%;min-height:68px;display:flex;justify-content:space-between;align-items:center;gap:16px;background:none;border:0;padding:20px 0;font:600 18px Inter,sans-serif;color:#17201A;text-align:left;cursor:pointer">{{f.q}}<span aria-hidden="true" style="font-size:24px;font-weight:400">{{f.sign}}</span></button>
            <sc-if value="{{f.open}}" hint-placeholder-val="{{false}}"><p style="margin:0 0 24px;max-width:760px;color:#4B4F45;line-height:1.7;font-size:16px">{{f.a}}</p></sc-if>
          </div>
        </sc-for>
        <div style="border-top:1px solid #DAD7CB"></div>
      </div>
    </div>
  </section>
</main>
<dc-import name="Footer" hint-size="100%,760px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2900}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { g: 0, open: 0 }; }
  renderVals() {
    const G = [
      { label:'Pedidos y envíos', items:[
        { q:'¿A dónde enviáis?', a:'Enviamos a toda la España peninsular con Envialia. Para Baleares, Canarias, Ceuta, Melilla y otros países preparamos un presupuesto a medida.' },
        { q:'¿Cuánto tarda en llegar mi pedido?', a:'[Plazo habitual de entrega en península.]' },
        { q:'¿Qué formas de pago aceptáis?', a:'PayPal y transferencia bancaria.' },
        { q:'¿Puedo hacer un pedido grande para mi empresa?', a:'Sí. Para estuches de empresa o pedidos de volumen, contacta con nosotros y te preparamos una propuesta.' }
      ]},
      { label:'Aceite de oliva', items:[
        { q:'¿Qué significa virgen extra?', a:'Es la categoría más alta: aceite obtenido solo por procedimientos mecánicos, sin defectos en cata y con una acidez máxima de 0,8º.' },
        { q:'¿Cómo conservo el aceite?', a:'En un lugar fresco, oscuro y bien cerrado. Si compras garrafa, rellena una aceitera opaca para el uso diario.' },
        { q:'¿Qué es la cosecha temprana?', a:'Aceite de aceitunas recogidas antes de su maduración completa: más verde, intenso y con más amargor y picante.' }
      ]},
      { label:'Vino', items:[
        { q:'¿Qué vinos elabora la cooperativa?', a:'Tinto, blanco y vino de mesa semidulce, también disponibles en estuche regalo.' },
        { q:'¿A qué temperatura sirvo el semidulce?', a:'Fresco, entre 6 y 8 ºC.' }
      ]},
      { label:'Cooperativa y socios', items:[
        { q:'¿Cómo me hago socio?', a:'[Requisitos y pasos para asociarse.]' },
        { q:'¿Dónde consulto los boletines A.T.R.I.A?', a:'En el Área de socios, junto a descargas y balances.' },
        { q:'¿Se puede visitar la cooperativa?', a:'Sí, organizamos visitas a la almazara y a las fincas. Reserva desde la página de Visitas.' }
      ]}
    ];
    const s = this.state, grp = G[s.g];
    const base = 'min-height:48px;padding:0 18px;border-radius:10px;text-align:left;font:500 15px Inter,sans-serif;cursor:pointer;';
    return {
      title: grp.label,
      groups: G.map((g, i) => ({ label: g.label, on: s.g === i ? 'true' : 'false', style: base + (s.g === i ? 'background:#17201A;color:#F6F5F0;border:1px solid #17201A' : 'background:transparent;color:#17201A;border:1px solid #DAD7CB'), pick: () => this.setState({ g: i, open: 0 }) })),
      faqs: grp.items.map((f, i) => ({ ...f, open: s.open === i, sign: s.open === i ? '−' : '+', toggle: () => this.setState({ open: s.open === i ? -1 : i }) }))
    };
  }
}
</script>
</body>
</html>
